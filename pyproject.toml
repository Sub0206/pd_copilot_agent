[project]
name = "pd_copilot_agent"
version = "0.1.0"
description = "PD Copilot Agent using FastAPI and OpenAI Agentic SDK with RAG"
requires-python = ">=3.9,<3.14"

dependencies = [
    "fastapi",
    "uvicorn[standard]",
    "openai>=1.0.0",
    "openai-agents>=0.4.0",
    "pydantic>=2.0.0,<3.0.0",
    "python-dotenv",
    "requests>=2.28.0",
    "beautifulsoup4>=4.12.0",
    "psycopg2-binary>=2.9.0",
    "pgvector>=0.2.0",
    "python-docx==1.1.0",
]

[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[tool.uv]
package = false